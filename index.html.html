<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Интервалы — тренажёр</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#171733;background:#f5f4fc}*{box-sizing:border-box}body{margin:0}.wrap{max-width:850px;margin:auto;padding:24px 16px}h1{font-size:26px;margin:0 0 6px}.muted{color:#686981}.card{background:white;border:1px solid #e2e0f0;border-radius:20px;padding:22px;margin-top:18px;box-shadow:0 8px 24px #2520600a}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.small{font-size:14px}.notes{text-align:center;font-size:38px;font-weight:750;margin:14px 0 6px}.piano{position:relative;height:145px;display:flex;margin:26px 0 12px;user-select:none}.white{position:relative;flex:1;background:linear-gradient(white,#f0eff9);border:1px solid #9695a6;border-radius:0 0 7px 7px;display:flex;align-items:end;justify-content:center;padding-bottom:12px;font-size:12px}.white.hit{background:#bba7ff}.white,.black{cursor:pointer;touch-action:manipulation}.white:active{background:#ddd2ff}.black:active{background:#956aff}.sound-actions{display:flex;gap:9px;justify-content:center;flex-wrap:wrap;margin-top:16px}.sound-actions button{flex:1;min-width:125px}.sound-status{text-align:center;font-size:13px;color:#686981;margin-top:9px;min-height:18px}.black{position:absolute;top:0;width:4.3%;height:87px;background:#252533;border-radius:0 0 5px 5px;z-index:2;transform:translateX(-50%)}.black.hit{background:#6b42dd}.black span{color:white;font-size:10px;position:absolute;bottom:8px;left:0;right:0;text-align:center}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}label{display:block;font-weight:650;margin-bottom:7px}input{width:100%;padding:13px 12px;border:1px solid #c9c6dc;border-radius:11px;font-size:16px;background:#fff}button{border:0;background:#7449e8;color:white;padding:14px 18px;border-radius:12px;font-size:16px;font-weight:650;cursor:pointer}button:disabled{opacity:.5}button.secondary{background:#eee9ff;color:#4b2fa4}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.feedback{margin-top:16px;padding:16px;border-radius:12px;background:#f2efff;line-height:1.65}.hidden{display:none}.pill{font-size:13px;background:#eee9ff;padding:7px 11px;border-radius:20px}.progress{height:8px;border-radius:9px;background:#e6e1f6;margin-top:12px;overflow:hidden}.progress>div{height:100%;background:#7449e8;width:0}#pianoNote{font-size:13px;color:#77718e;text-align:center}@media(max-width:560px){.grid{grid-template-columns:1fr}.notes{font-size:31px}.card{padding:16px}.white{font-size:10px}.piano{height:125px}.black{height:78px}}</style></head><body><main class="wrap"><div class="top"><div><h1>🎹 Интервалы</h1><div class="muted">Тренажёр по сольфеджио</div></div><span class="pill" id="count">Задание 1</span></div><div class="progress"><div id="bar"></div></div><section class="card"><div class="small muted" style="text-align:center">ОПРЕДЕЛИ ИНТЕРВАЛ</div><div class="notes" id="question">Ля♭ → Ре</div><div class="muted small" style="text-align:center">Верхняя нота звучит выше нижней</div><div class="piano" id="piano"><div class="white" data-note="0">До</div><div class="white" data-note="2">Ре</div><div class="white" data-note="4">Ми</div><div class="white" data-note="5">Фа</div><div class="white" data-note="7">Соль</div><div class="white" data-note="9">Ля</div><div class="white" data-note="11">Си</div><div class="white" data-note="12">До</div><div class="white hit" data-note="14">Ре</div><div class="white" data-note="16">Ми</div><div class="white" data-note="17">Фа</div><div class="white" data-note="19">Соль</div><div class="white" data-note="21">Ля</div><div class="white" data-note="23">Си</div><div class="white" data-note="24">До</div><div class="black" data-note="1" style="left:6.666666666666667%"></div><div class="black" data-note="3" style="left:13.333333333333334%"></div><div class="black" data-note="6" style="left:26.666666666666668%"></div><div class="black hit" data-note="8" style="left:33.33333333333333%"></div><div class="black" data-note="10" style="left:40.0%"></div><div class="black" data-note="13" style="left:53.333333333333336%"></div><div class="black" data-note="15" style="left:60.0%"></div><div class="black" data-note="18" style="left:73.33333333333333%"></div><div class="black" data-note="20" style="left:80.0%"></div><div class="black" data-note="22" style="left:86.66666666666667%"></div></div><div id="pianoNote">Фиолетовым отмечены Ля♭ и Ре</div><div class="sound-actions"><button type="button" id="playSequential">♫ По очереди</button><button type="button" id="playTogether" class="secondary">♫ Вместе</button></div><div class="sound-status" id="soundStatus" aria-live="polite">Нажми любую клавишу, чтобы услышать ноту</div><div class="actions" style="justify-content:center"><button class="secondary" id="reveal" type="button">Скрыть подсветку</button></div></section><section class="card"><div class="grid"><div><label for="steps">1. Количество ступеней</label><input id="steps" autocomplete="off" inputmode="numeric" placeholder="Введи число"></div><div><label for="tones">2. Количество тонов</label><input id="tones" autocomplete="off" inputmode="decimal" placeholder="Например: 1,5"></div><div><label for="name">3. Полное название</label><input id="name" autocomplete="off" placeholder="Напиши название"></div><div><label for="symbol">4. Обозначение</label><input id="symbol" autocomplete="off" placeholder="Например: ч4"></div></div><div class="actions"><button id="check">Проверить ответы</button><button class="secondary hidden" id="next">Следующее задание →</button></div><div class="feedback hidden" id="feedback"></div></section></main><script>const names=['До','До♯','Ре','Ре♯','Ми','Фа','Фа♯','Соль','Соль♯','Ля','Ля♯','Си'];const whiteNames=['До','Ре','Ми','Фа','Соль','Ля','Си'];const offsets=[0,2,4,5,7,9,11];const blackAfter=[0,1,3,4,5];const qualities={1:{0:['чистая прима','ч1'],1:['увеличенная прима','ув1']},2:{0:['уменьшённая секунда','ум2'],'0.5':['малая секунда','м2'],1:['большая секунда','б2'],'1.5':['увеличенная секунда','ув2']},3:{1:['уменьшённая терция','ум3'],'1.5':['малая терция','м3'],2:['большая терция','б3'],'2.5':['увеличенная терция','ув3']},4:{2:['уменьшённая кварта','ум4'],'2.5':['чистая кварта','ч4'],3:['увеличенная кварта','ув4']},5:{3:['уменьшённая квинта','ум5'],'3.5':['чистая квинта','ч5'],4:['увеличенная квинта','ув5']},6:{'3.5':['уменьшённая секста','ум6'],4:['малая секста','м6'],'4.5':['большая секста','б6'],5:['увеличенная секста','ув6']},7:{'4.5':['уменьшённая септима','ум7'],5:['малая септима','м7'],'5.5':['большая септима','б7'],6:['увеличенная септима','ув7']},8:{'5.5':['уменьшённая октава','ум8'],6:['чистая октава','ч8'],'6.5':['увеличенная октава','ув8']}};const questions=[{a:'Ля♭',b:'Ре',start:8,end:14,degree:4},{a:'До♯',b:'Соль',start:1,end:7,degree:5},{a:'Ми♭',b:'До',start:3,end:12,degree:6},{a:'Ре',b:'Соль♯',start:2,end:8,degree:4},{a:'Соль♯',b:'Фа',start:8,end:17,degree:7},{a:'Ми',b:'Ре♯',start:4,end:15,degree:7},{a:'Си♭',b:'Фа',start:10,end:17,degree:5},{a:'Фа♯',b:'Ре',start:6,end:14,degree:6},{a:'Соль',b:'Ля♭',start:7,end:8,degree:2},{a:'До',b:'До',start:0,end:12,degree:8},{a:'Ре♭',b:'Фа',start:1,end:5,degree:3},{a:'Фа',b:'Си',start:5,end:11,degree:4}];let idx=0;try{idx=Number(localStorage.getItem('intervalIndex')||0)}catch(e){}let shown=true,checked=false;const $=x=>document.getElementById(x);function piano(){let html='';for(let i=0;i<15;i++)html+=`<div data-note="${offsets[i%7]+12*Math.floor(i/7)}" class="white ${shown&&(offsets[i%7]+12*Math.floor(i/7)===current().start||offsets[i%7]+12*Math.floor(i/7)===current().end)?'hit':''}">${whiteNames[i%7]}</div>`;for(let i=0;i<14;i++)if(blackAfter.includes(i%7)){let midi=offsets[i%7]+1+12*Math.floor(i/7);html+=`<div data-note="${midi}" class="black ${shown&&(midi===current().start||midi===current().end)?'hit':''}" style="left:${(i+1)/15*100}%"><span>${shown&&(midi===current().start||midi===current().end)?'●':''}</span></div>`} $('piano').innerHTML=html;$('pianoNote').textContent=shown?'Фиолетовым отмечены обе ноты интервала':'Ноты на клавиатуре показаны без подсветки';$('reveal').textContent=shown?'Скрыть подсветку':'Показать ноты на клавиатуре'}function current(){return questions[idx%questions.length]}function render(){const q=current();shown=true;checked=false;$('question').textContent=q.a+' → '+q.b;$('count').textContent='Задание '+(idx+1);$('bar').style.width=((idx%questions.length)/questions.length*100)+'%';['steps','tones','name','symbol'].forEach(x=>$(x).value='');$('feedback').classList.add('hidden');$('next').classList.add('hidden');$('check').disabled=false;piano()}function norm(s){return s.toLowerCase().replace(/[.\s-]/g,'').replace(/ё/g,'е')}function check(){if(checked)return;const q=current(),tones=(q.end-q.start)/2,answer=qualities[q.degree]?.[tones];if(!answer)return;const expected=[String(q.degree),String(tones),answer[0],answer[1]],given=['steps','tones','name','symbol'].map(x=>$(x).value.trim());if(given.some(x=>!x)){alert('Заполни все четыре поля');return}const correct=given.map((x,i)=>i===1?Number(x.replace(',','.'))===tones:norm(x)===norm(expected[i]));const lines=['Ступени','Тоны','Название','Обозначение'].map((s,i)=>`${correct[i]?'✅':'❌'} ${s}: ${expected[i]}`);$('feedback').innerHTML=`<strong>${correct.filter(Boolean).length} из 4 правильно</strong><div>${lines.join('<br>')}</div><div style="margin-top:8px">Расстояние между нотами — ${tones} тонов. Название определяется количеством ступеней и величиной интервала.</div>`;$('feedback').classList.remove('hidden');$('next').classList.remove('hidden');$('check').disabled=true;checked=true;shown=true;piano()}$('check').onclick=check;$('next').onclick=()=>{idx++;try{localStorage.setItem('intervalIndex',idx)}catch(e){}render()};$('reveal').onclick=()=>{shown=!shown;piano()};
// Web Audio: short, harmonically rich piano-like tones, without external audio files.
let audioCtx=null;
function context(){const C=window.AudioContext||window.webkitAudioContext;if(!C){$('soundStatus').textContent='Этот браузер не поддерживает воспроизведение звука';return null}if(!audioCtx)audioCtx=new C();if(audioCtx.state==='suspended')audioCtx.resume();return audioCtx}
function playNote(key,delay=0,duration=1.25){const ctx=context();if(!ctx)return;const start=ctx.currentTime+delay;const freq=261.625565*Math.pow(2,key/12);const master=ctx.createGain();master.gain.value=0.22;master.connect(ctx.destination);const harmonics=[1,.37,.16,.075,.035];harmonics.forEach((amp,i)=>{const osc=ctx.createOscillator();const env=ctx.createGain();osc.type='sine';osc.frequency.setValueAtTime(freq*(i+1),start);env.gain.setValueAtTime(.0001,start);env.gain.exponentialRampToValueAtTime(Math.max(.0001,amp*.7),start+.012);env.gain.exponentialRampToValueAtTime(Math.max(.0001,amp*.2),start+.20);env.gain.exponentialRampToValueAtTime(.0001,start+duration);osc.connect(env);env.connect(master);osc.start(start);osc.stop(start+duration+.04)});$('soundStatus').textContent='Звук включён • можно нажимать на клавиши'}
$('piano').addEventListener('pointerdown',e=>{const key=e.target.closest('[data-note]');if(key)playNote(Number(key.dataset.note))});
$('playSequential').onclick=()=>{const q=current();playNote(q.start,0,.9);playNote(q.end,.75,1.4)};
$('playTogether').onclick=()=>{const q=current();playNote(q.start,0,1.6);playNote(q.end,0,1.6)};
render();</script></body></html>
