name: Install piano sounds

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: install-piano-main
  cancel-in-progress: false

jobs:
  install:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main

      - name: Download and commit piano samples
        shell: bash
        run: |
          base=https://tonejs.github.io/audio/salamander
          staging=$(mktemp -d)
          cat >"$staging/SHA256SUMS" <<'CHECKSUMS'
          689eaa4c2fd7f29a2cc0e386eec462156d523a87d701269e5e2458e66056f4f6  C4.mp3
          663e8bb3e2d0fa23a30526dcd7ab0e42609c193c07025647ef46badcf81ec211  Ds4.mp3
          613652f5c96e35736ce6a46bc4ddb6ba1076d1fb16a35a4c22c14e67efdde57c  Fs4.mp3
          a62df24a2c84cea8d18c1fa8aca7c18c877ba2b76a00a591256fa74d3ce54ac3  A4.mp3
          2f5b0f7422063010fb379e684bfdf2daa3911dcd2251413d79fa2a53029fdc30  C5.mp3
          bf71096e653ab7ceca3914b9fd44d8c27fe83c162564c5db34bd06b94eb14b8c  Ds5.mp3
          ed2fdf543274ea72ddd4eb634a16356531a5f4040b2a60d34fb12a5c72cbf22f  Fs5.mp3
          9e5cee1fe9cf68b7193623d46a27c8956e572c1ff234ca0e11599b556050dec6  A5.mp3
          0d3232edd13ba69fd5caf4a295060ae0fd533b8a1433ae0a038644d70715c907  C6.mp3
          eb643014d9f926f1a5f9f51fc4a1ed8c07c6da36ce164d5b221d7b878a53f142  Ds6.mp3
          c584d2b4e96a37b12c920ed3212d149abedf25342389bfdc557b2fac847ab11c  Fs6.mp3
          b6064a657592c63c03561d2ce1092607c14e1d8091445d50065d0ec819ff6fbc  A6.mp3
          694b512fac99ba7f7290c045d9c18e94724a7ebcc319b937baabc62125814283  C7.mp3
          CHECKSUMS

          samples=()
          while read -r digest sample; do
            samples+=("$sample")
            curl --fail --silent --show-error --location --retry 3 \
              --connect-timeout 10 --max-time 60 \
              "$base/$sample" --output "$staging/$sample"
          done <"$staging/SHA256SUMS"
          (cd "$staging" && sha256sum --check SHA256SUMS)

          cat >"$staging/LICENSE.txt" <<'LICENSE'
          Salamander Grand Piano (Yamaha C5) by Alexander Holm
          Creative Commons Attribution 3.0 Unported (CC BY 3.0)
          https://creativecommons.org/licenses/by/3.0/
          Sample library: https://sfzinstruments.github.io/pianos/salamander/
          MP3 distribution: https://github.com/Tonejs/audio/tree/master/salamander
          MP3 files are copied as distributed by Tone.js.
          LICENSE

          mkdir -p sounds
          for sample in "${samples[@]}" LICENSE.txt; do
            cp "$staging/$sample" "sounds/$sample"
            git add -- "sounds/$sample"
          done

          if git diff --cached --quiet; then
            echo 'Piano samples are already installed.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Install Salamander piano samples'
          git push origin HEAD:main
