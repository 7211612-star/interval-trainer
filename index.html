// Each sample is rooted at a key offset from C4.
const pianoSampleNames = ["C4.mp3","Ds4.mp3","Fs4.mp3","A4.mp3","C5.mp3","Ds5.mp3","Fs5.mp3","A5.mp3","C6.mp3","Ds6.mp3","Fs6.mp3","A6.mp3","C7.mp3"];
const pianoSampleFiles = pianoSampleNames.map(file =>
  fetch('./sounds/' + file)
    .then(response => response.ok ? response.arrayBuffer() : null)
    .catch(() => null)
);
const pianoSampleBuffers = new Array(pianoSampleNames.length);
let audioCtx;

function context() {
  const Audio = window.AudioContext || window.webkitAudioContext;
  if (!Audio) return null;
  if (!audioCtx) {
    audioCtx = new Audio();
    pianoSampleFiles.forEach(async (file, index) => {
      try {
        const bytes = await file;
        if (bytes) pianoSampleBuffers[index] = await audioCtx.decodeAudioData(bytes);
      } catch {
        // A missing or unreadable sample leaves the synth available.
      }
    });
  }
  if (audioCtx.state !== 'running') audioCtx.resume().catch(() => {});
  return audioCtx;
}

function playSynthNote(ctx, key, start, duration) {
  const freq=261.625565*Math.pow(2,key/12);const master=ctx.createGain();master.gain.value=0.22;master.connect(ctx.destination);const harmonics=[1,.37,.16,.075,.035];harmonics.forEach((amp,i)=>{const osc=ctx.createOscillator();const env=ctx.createGain();osc.type='sine';osc.frequency.setValueAtTime(freq*(i+1),start);env.gain.setValueAtTime(.0001,start);env.gain.exponentialRampToValueAtTime(Math.max(.0001,amp*.7),start+.012);env.gain.exponentialRampToValueAtTime(Math.max(.0001,amp*.2),start+.20);env.gain.exponentialRampToValueAtTime(.0001,start+duration);osc.connect(env);env.connect(master);osc.start(start);osc.stop(start+duration+.04)})
}

function playPianoSample(ctx, buffer, key, root, start, duration) {
  const source = ctx.createBufferSource();
  const envelope = ctx.createGain();
  source.buffer = buffer;
  source.playbackRate.value = 2 ** ((key - root) / 12);
  const end = start + duration;
  const gain = 0.55;
  envelope.gain.setValueAtTime(gain, start);
  envelope.gain.setValueAtTime(gain, end - 0.18);
  envelope.gain.exponentialRampToValueAtTime(0.0001, end);
  source.connect(envelope);
  envelope.connect(ctx.destination);
  source.onended = () => {
    source.disconnect();
    envelope.disconnect();
  };
  source.start(start);
  source.stop(end);
}

function playNotes(notes) {
  const ctx = context();
  if (!ctx) return;
  const start = ctx.currentTime + 0.01;
  const roots = notes.map(([key]) => Math.round(key / 3));
  const useSamples = roots.every(root => pianoSampleBuffers[root]);
  notes.forEach(([key, delay, duration], index) => {
    const root = roots[index];
    if (useSamples) {
      playPianoSample(ctx, pianoSampleBuffers[root], key, root * 3, start + delay, duration);
    } else {
      playSynthNote(ctx, key, start + delay, duration);
    }
  });
}

function playNote(key) {
  playNotes([[key, 0, 1.25]]);
}

// Reuse the main trainer's interval definitions.
const quizIntervals = Object.entries(qualities)
  .filter(([degree]) => Number(degree) <= 8)
  .flatMap(([degree, entries]) => Object.entries(entries)
    .filter(([, [, symbol]]) => /^[чмб]/.test(symbol) || symbol === 'ув4' || symbol === 'ум5')
    .map(([tones, [name, symbol]]) => ({
      degree: Number(degree), tones: Number(tones), name: cap(name), symbol
    })));
const quizQuestionsPerType = 4;
let quizRound = [];
let quizIndex = 0;
let quizScore = 0;
let quizAnswered = false;

function quizShuffle(items) {
  const shuffled = [...items];
  for (let index = shuffled.length - 1; index > 0; index--) {
    const other = Math.floor(Math.random() * (index + 1));
    [shuffled[index], shuffled[other]] = [shuffled[other], shuffled[index]];
  }
  return shuffled;
}

function quizMeasure(value, [one, few, many]) {
  if (value === 1) return fmt(value) + ' ' + one;
  if (!Number.isInteger(value) || (value >= 2 && value <= 4)) return fmt(value) + ' ' + few;
  return fmt(value) + ' ' + many;
}

const quizSteps = value => quizMeasure(value, ['ступень', 'ступени', 'ступеней']);
const quizTones = value => quizMeasure(value, ['тон', 'тона', 'тонов']);

function quizNumericOptions(answer, step, minimum, maximum) {
  const offset = step * Math.floor(Math.random() * 4);
  const start = Math.min(maximum - 3 * step, Math.max(minimum, answer - offset));
  return Array.from({length: 4}, (_, index) => start + index * step);
}

function quizQuestionPools() {
  const exactIntervals = [];
  const toneQuestions = [];
  for (const interval of quizIntervals) {
    const {degree, tones, name, symbol} = interval;
    const measures = quizSteps(degree) + ' и ' + quizTones(tones);
    const explanation = name + ' (' + symbol + ') — ' + measures + '.';
    const distance = candidate => Math.abs(candidate.degree - degree) + Math.abs(candidate.tones - tones);
    const distractors = quizShuffle(quizIntervals.filter(candidate => candidate !== interval))
      .sort((a, b) => distance(a) - distance(b)).slice(0, 3);
    exactIntervals.push({
      prompt: measures + '. Какой это интервал?',
      answer: name,
      options: [name, ...distractors.map(candidate => candidate.name)],
      explanation
    });
    toneQuestions.push({
      prompt: 'Сколько тонов в интервале «' + name + '»?',
      answer: quizTones(tones),
      options: quizNumericOptions(tones, 0.5, 0, 7).map(quizTones),
      explanation
    });
  }
  const stepQuestions = Array.from({length: 8}, (_, index) => {
    const degree = index + 1;
    const name = cap(intervalNames[degree]);
    return {
      prompt: 'Сколько ступеней в интервале «' + name + '»?',
      answer: quizSteps(degree),
      options: quizNumericOptions(degree, 1, 1, 8).map(quizSteps),
      explanation: name + ' — ' + quizSteps(degree) + '. При счёте учитываются обе ноты интервала.'
    };
  });
  return [stepQuestions, toneQuestions, exactIntervals];
}

function renderQuizQuestion(focusQuestion = false) {
  const question = quizRound[quizIndex];
  quizAnswered = false;
  $('quizProgress').textContent = 'Вопрос ' + (quizIndex + 1) + ' из ' + quizRound.length;
  $('quizScore').textContent = 'Верно: ' + quizScore + ' из ' + quizIndex;
  $('quizQuestion').textContent = question.prompt;
  $('quizOptions').hidden = false;
  $('quizOptions').replaceChildren();
  $('quizFeedback').replaceChildren();
  $('quizFeedback').className = '';
  $('quizNext').hidden = true;
  for (const option of quizShuffle(question.options)) {
    const button = document.createElement('button');
    button.type = 'button';
    button.textContent = option;
    button.addEventListener('click', () => answerQuizQuestion(option));
    $('quizOptions').append(button);
  }
  if (focusQuestion) $('quizQuestion').focus();
}

function answerQuizQuestion(option) {
  if (quizAnswered) return;
  quizAnswered = true;
  const question = quizRound[quizIndex];
  const correct = option === question.answer;
  if (correct) quizScore++;
  $('quizScore').textContent = 'Верно: ' + quizScore + ' из ' + (quizIndex + 1);
  for (const button of $('quizOptions').children) {
    button.disabled = true;
    if (button.textContent === question.answer) button.classList.add('quiz-correct');
    else if (button.textContent === option) button.classList.add('quiz-incorrect');
  }
  const feedback = document.createElement('strong');
  feedback.className = correct ? 'ok' : 'error';
  feedback.textContent = correct ? 'Верно!' : 'Неверно.';
  $('quizFeedback').className = 'feedback';
  $('quizFeedback').replaceChildren(feedback, ' ' + question.explanation);
  $('quizNext').textContent = quizIndex + 1 === quizRound.length ? 'Показать результат' : 'Следующий вопрос';
  $('quizNext').hidden = false;
  $('quizNext').focus();
}

function startQuiz(focusQuestion = false) {
  quizRound = quizShuffle(quizQuestionPools().flatMap(pool => quizShuffle(pool).slice(0, quizQuestionsPerType)));
  quizIndex = 0;
  quizScore = 0;
  renderQuizQuestion(focusQuestion);
}

$('quizNext').addEventListener('click', () => {
  if (quizIndex === quizRound.length) {
    startQuiz(true);
    return;
  }
  quizIndex++;
  if (quizIndex < quizRound.length) {
    renderQuizQuestion(true);
    return;
  }
  $('quizProgress').textContent = 'Раунд завершён';
  $('quizQuestion').textContent = 'Правильных ответов: ' + quizScore + ' из ' + quizRound.length;
  $('quizOptions').hidden = true;
  $('quizFeedback').replaceChildren();
  $('quizFeedback').className = '';
  $('quizNext').textContent = 'Новый раунд';
  $('quizQuestion').focus();
});
